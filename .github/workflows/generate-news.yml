name: Generate Taylor Swift News
# Ejecutar DIARIAMENTE a las 10:00 AM UTC con rotación automática de feeds
# Estrategia: 2 feeds/día para mantenerse dentro del límite de 100K tokens/día de Groq
on:
  schedule:
    - cron: "0 10 * * *" # Todos los días a las 10:00 UTC

  # Permitir ejecución manual desde GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🛠️ Install tsx for TypeScript execution
        run: npm install -D tsx

      - name: 🤖 Run news scraper
        env:
          NEWS_API_URL: ${{ secrets.NEWS_API_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -o pipefail
          npx tsx scripts/scrape-news.js 2>&1 | tee taylor-news-scraper.log
        # Nota: El scraper ahora evita imágenes proxy de Google (lh3.googleusercontent.com)
        # y prioriza imágenes OG del artículo original. Se agregaron logs detallados
        # para depurar el origen y la URL final de cada imagen procesada.

      - name: 📊 Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taylor-swift-scraper-logs-${{ github.run_number }}
          path: |
            *.log
            taylor-news-scraper.log
          retention-days: 30
