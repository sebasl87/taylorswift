name: Generate Taylor Swift News

on:
  # Ejecutar cada lunes y jueves a las 10:00 UTC
  schedule:
    - cron: "0 10 * * 1,4"

  # Permitir ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate news articles
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-news.js

      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/constants/news.json
          git add public/images/news/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update news articles [automated]"
            git push
          fi

      - name: Trigger Vercel deployment (opcional)
        if: env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -X POST "$VERCEL_DEPLOY_HOOK"
